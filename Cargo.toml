[workspace]
resolver = "2"
members = [
    "crates/adscli",
    "crates/adscli-api",
    "crates/adscli-config",
    "crates/adscli-tui",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/dvaldivia/adscli"
authors = ["Daniel Valdivia"]

[workspace.dependencies]
adscli-api = { path = "crates/adscli-api" }
adscli-config = { path = "crates/adscli-config" }
adscli-tui = { path = "crates/adscli-tui" }

clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tabwriter = "1"
dirs = "6"
base64 = "0.22"
ratatui = "0.30"
crossterm = "0.29"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
mockito = "1"
sha2 = "0.10"
getrandom = "0.2"
keyring = "3"
webbrowser = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
