apiVersion: v1
kind: Namespace
metadata:
  name: adscli
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: adscli
  labels:
    app: adscli-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adscli-web
  template:
    metadata:
      labels:
        app: adscli-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: html
              mountPath: /usr/share/nginx/html/privacy.html
              subPath: privacy.html
            - name: html
              mountPath: /usr/share/nginx/html/support.html
              subPath: support.html
            - name: html
              mountPath: /usr/share/nginx/html/style.css
              subPath: style.css
            - name: assets
              mountPath: /usr/share/nginx/html/assets
      volumes:
        - name: html
          configMap:
            name: adscli-web-html
        - name: assets
          configMap:
            name: adscli-web-assets
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: adscli
spec:
  selector:
    app: adscli-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: adscli
spec:
  parentRefs:
    - name: nginx
      namespace: shared
      port: 443
  hostnames:
    - adscli.dev
    - www.adscli.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-http-redirect
  namespace: adscli
spec:
  parentRefs:
    - name: nginx
      namespace: shared
      port: 80
  hostnames:
    - adscli.dev
    - www.adscli.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
      matches:
        - path:
            type: PathPrefix
            value: /
